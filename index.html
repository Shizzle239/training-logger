<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Personal training logger — 6-week strength block">
  <title>Training Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header id="topbar">
    <button type="button" id="topbar-back" aria-label="back" hidden>‹</button>
    <span id="topbar-title">Training Logger</span>
    <button type="button" id="topbar-timer" aria-label="rest timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.8M9.5 2.5h5M12 2.5V6"/></svg></button>
  </header>

  <main id="app">
    <div class="card"><p class="muted">Loading…</p></div>
  </main>

  <nav id="bottomnav">
    <a href="#/" data-view="home"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span>Home</a>
    <a href="#/maxes" data-view="maxes"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.2 7v10M9 9.5v5M15 9.5v5M17.8 7v10M2.5 12h3.7M9 12h6M17.8 12h3.7"/></svg></span>Maxes</a>
    <a href="#/progress" data-view="progress"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5h18"/><path d="M4 16.5l5-5 4 3 7-8"/></svg></span>Progress</a>
    <a href="#/plans" data-view="plans"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4.5"/></svg></span>Plans</a>
    <a href="#/data" data-view="data"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.6 3.4 2.9 7.5 2.9s7.5-1.3 7.5-2.9v-13"/><path d="M4.5 12c0 1.6 3.4 2.9 7.5 2.9s7.5-1.3 7.5-2.9"/></svg></span>Data</a>
  </nav>

  <div id="timer-sheet" hidden>
    <div class="timer-head">
      <span>Rest timer</span>
      <button type="button" id="timer-close" aria-label="minimize">▾</button>
    </div>
    <div id="timer-display">Rest</div>
    <div id="timer-presets">
      <button type="button" data-s="30">30s</button>
      <button type="button" data-s="45">45s</button>
      <button type="button" data-s="60">60s</button>
      <button type="button" data-s="90">90s</button>
      <button type="button" data-s="120">2m</button>
    </div>
    <div class="timer-actions">
      <button type="button" id="timer-plus">+15s</button>
      <button type="button" id="timer-stop">Stop</button>
    </div>
  </div>

  <button type="button" id="timer-pill" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.8M9.5 2.5h5M12 2.5V6"/></svg> <span id="timer-pill-time">0:00</span></button>

  <div id="toast" hidden></div>

  <script src="db.js"></script>
  <script src="xlsx.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
